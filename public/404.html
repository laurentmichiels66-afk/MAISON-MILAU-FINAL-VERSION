<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maison Milau - Ambachtelijke Koffiebranderij</title>
    <script>
      // Single Page Application deep link restorer for static edge servers
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        // In case the host serves this static 404 file, redirect to root with route query
        sessionStorage.setItem('spa_redirect_path', path + search + hash);
        window.location.replace('/' + (search ? search : ''));
      })();
    </script>
  </head>
  <body style="font-family: sans-serif; background-color: #FBF9F5; color: #2A1D17; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <p>Pagina laden...</p>
    </div>
  </body>
</html>
